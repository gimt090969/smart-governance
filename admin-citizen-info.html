<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการศูนย์ข้อมูลประชาชน - GOOD GOV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: #f0f3f8; }
        .admin-nav { background: #1e293b; color: white; }
    </style>
</head>

<body>
    <!-- Admin Navbar -->
    <nav class="navbar admin-nav shadow-sm sticky-top mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-white" href="#">
                <i class="fa-solid fa-screwdriver-wrench"></i> ระบบจัดการศูนย์ข้อมูลประชาชน (Admin)
            </a>
            <div class="d-flex align-items-center gap-3">
                <a href="dashboard.html" class="text-white text-decoration-none text-sm"><i class="fa-solid fa-house me-1"></i> เมนูหลัก</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 mb-5">
        <div class="row g-4">
            <!-- Sidebar -->
            <div class="col-lg-3">
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-0">
                        <div class="list-group list-group-flush rounded-4">
                            <button class="list-group-item list-group-item-action active py-3 fw-semibold"><i class="fa-solid fa-landmark me-2"></i> ข่าวสารและประกาศ</button>
                            <button class="list-group-item list-group-item-action py-3 fw-semibold"><i class="fa-solid fa-triangle-exclamation me-2"></i> ศูนย์แจ้งเตือน</button>
                            <button class="list-group-item list-group-item-action py-3 fw-semibold"><i class="fa-solid fa-cloud-sun me-2"></i> ตั้งค่า API (TMD/Air4Thai)</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Content -->
            <div class="col-lg-9">
                <!-- ข่าวสารและประกาศ -->
                <div class="card border-0 shadow-sm rounded-4 mb-4">
                    <div class="card-header bg-white border-bottom-0 pt-4 pb-0 d-flex justify-content-between align-items-center">
                        <h5 class="fw-bold mb-0 text-primary">จัดการข่าวสารและประกาศ</h5>
                        <button class="btn btn-primary rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#addNewsModal"><i class="fa-solid fa-plus me-1"></i> สร้างข่าวใหม่</button>
                    </div>
                    <div class="card-body p-4">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>วันที่เผยแพร่</th>
                                        <th>หมวดหมู่</th>
                                        <th>หัวข้อข่าว</th>
                                        <th>ยอดชม</th>
                                        <th>สถานะ</th>
                                        <th>จัดการ</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td class="text-muted text-sm">17 ก.ย. 2026</td>
                                        <td><span class="badge bg-info bg-opacity-10 text-info">ข่าวโครงการ</span></td>
                                        <td class="fw-semibold">เชิญชวนประชาชนร่วมโครงการคัดแยกขยะ</td>
                                        <td>125</td>
                                        <td><span class="badge bg-success">เผยแพร่แล้ว</span></td>
                                        <td>
                                            <button class="btn btn-sm btn-outline-secondary"><i class="fa-solid fa-pen"></i></button>
                                            <button class="btn btn-sm btn-outline-danger"><i class="fa-solid fa-trash"></i></button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Add News -->
    <div class="modal fade" id="addNewsModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content rounded-4 border-0">
                <div class="modal-header border-bottom-0">
                    <h5 class="modal-title fw-bold">สร้างข่าวสาร/ประกาศใหม่</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formAddNews">
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label fw-semibold">หัวข้อข่าว <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" required placeholder="ระบุหัวข้อข่าว">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">หมวดหมู่</label>
                                <select class="form-select">
                                    <option>ข่าวประชาสัมพันธ์</option>
                                    <option>ประกาศเทศบาล</option>
                                    <option>ข่าวบริการประชาชน</option>
                                    <option>สวัสดิการ</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">เนื้อหาสรุป (สั้นๆ)</label>
                                <textarea class="form-control" rows="2" placeholder="อธิบายสรุปสั้นๆ ให้ประชาชนเข้าใจง่าย"></textarea>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">รูปภาพหน้าปก (URL)</label>
                                <input type="url" class="form-control" placeholder="https://...">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-top-0">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">ยกเลิก</button>
                    <button type="button" class="btn btn-primary rounded-pill px-4" onclick="saveNews()"><i class="fa-solid fa-save me-1"></i> บันทึกและเผยแพร่</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function saveNews() {
            Swal.fire({
                title: 'บันทึกสำเร็จ!',
                text: 'ระบบได้ทำการเผยแพร่ข่าวสารเรียบร้อยแล้ว',
                icon: 'success',
                confirmButtonColor: '#0d6efd',
                confirmButtonText: 'ตกลง'
            }).then(() => {
                const modal = bootstrap.Modal.getInstance(document.getElementById('addNewsModal'));
                if(modal) modal.hide();
                document.getElementById('formAddNews').reset();
            });
        }
    </script>
</body>

</html>
