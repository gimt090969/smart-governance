<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ฐานข้อมูลบ้านเลขที่ (DIIS) - กองช่าง</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; }
        .table-gov thead th {
            background-color: #1e293b;
            color: white;
            font-weight: 500;
        }
    </style>
</head>
<body>
<nav id="sidebar"></nav>
<div id="content">
    <div id="top-navbar" class="top-navbar" data-title="ฐานข้อมูลบ้านเลขที่และสิ่งปลูกสร้าง"></div>
    <div class="page-content p-4">

        <!-- Header -->
        <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
            <div>
                <h1 class="text-xl font-bold text-slate-800 mb-0 d-flex align-items-center gap-2">
                    <i class="fa-solid fa-house-chimney text-indigo-600"></i> ฐานข้อมูลบ้านเลขที่และสิ่งปลูกสร้าง
                </h1>
                <p class="text-xs text-slate-500 mb-0">ข้อมูลเชื่อมโยงจาก Google Sheets ฐานข้อมูลผู้นำชุมชน (สิ่งปลูกสร้าง)</p>
            </div>
            <div class="flex gap-2">
                <a href="https://docs.google.com/spreadsheets/d/14nG66q5NgSg3bBVnN2WfHgf0cVeMsKVz87B3QBhxVyo/edit?gid=492044978#gid=492044978" target="_blank" class="btn btn-sm btn-outline-success">
                    <i class="fa-solid fa-file-excel me-1"></i> เปิด Google Sheet
                </a>
                <button class="btn btn-sm btn-indigo text-white bg-indigo-600 hover:bg-indigo-700 fw-semibold" onclick="loadHouseData()">
                    <i class="fa-solid fa-sync me-1"></i> รีเฟรชข้อมูล
                </button>
            </div>
        </div>

        <!-- Filter / Search -->
        <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 mb-4 flex items-center justify-between flex-wrap gap-3">
            <div class="flex items-center gap-2 w-full md:w-auto flex-grow max-w-md">
                <i class="fa-solid fa-search text-slate-400"></i>
                <input type="text" class="form-control form-control-sm border-0 bg-slate-50" id="searchInput" placeholder="ค้นหาบ้านเลขที่, ชื่อเจ้าบ้าน..." onkeyup="filterTable()">
            </div>
            <div class="d-flex gap-2">
                <select class="form-select form-select-sm" id="mooFilter" onchange="filterTable()">
                    <option value="">ทุกหมู่บ้าน</option>
                    <option value="1">หมู่ 1</option>
                    <option value="2">หมู่ 2</option>
                    <option value="3">หมู่ 3</option>
                    <option value="4">หมู่ 4</option>
                    <option value="5">หมู่ 5</option>
                </select>
            </div>
        </div>

        <!-- Data Table -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden text-xs font-medium text-slate-700">
            <div class="table-responsive" style="max-height: calc(100vh - 250px);">
                <table class="table table-gov table-hover mb-0 align-middle">
                    <thead class="sticky-top">
                        <tr>
                            <th class="ps-4 text-nowrap">รหัสบ้าน</th>
                            <th class="text-nowrap">บ้านเลขที่</th>
                            <th class="text-nowrap text-center">หมู่</th>
                            <th class="text-nowrap">ชื่อ-สกุล (เจ้าบ้าน)</th>
                            <th class="text-nowrap">พิกัด GPS</th>
                            <th class="text-nowrap text-center">ภาพถ่ายสิ่งปลูกสร้าง</th>
                            <th class="text-nowrap text-center">ภาพถ่ายถังขยะ</th>
                            <th class="text-nowrap text-center">ภาพถ่ายมิเตอร์น้ำ</th>
                        </tr>
                    </thead>
                    <tbody id="houseTableBody">
                        <tr><td colspan="8" class="text-center py-5 text-muted">กำลังโหลดข้อมูลจาก Google Sheets...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/14nG66q5NgSg3bBVnN2WfHgf0cVeMsKVz87B3QBhxVyo/gviz/tq?tqx=out:csv&sheet=สิ่งปลูกสร้าง';
    let allData = [];

    document.addEventListener('DOMContentLoaded', () => {
        loadHouseData();
    });

    function loadHouseData() {
        const tbody = document.getElementById('houseTableBody');
        tbody.innerHTML = '<tr><td colspan="8" class="text-center py-5 text-muted"><i class="fa-solid fa-circle-notch fa-spin me-2"></i> กำลังซิงค์ข้อมูลจาก Google Sheets...</td></tr>';
        
        Papa.parse(SHEET_URL, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                if (results.data && results.data.length > 0) {
                    allData = results.data;
                    populateMooFilter(allData);
                    renderTable(allData);
                } else {
                    tbody.innerHTML = '<tr><td colspan="8" class="text-center py-5 text-danger">ไม่พบข้อมูลในชีต สิ่งปลูกสร้าง</td></tr>';
                }
            },
            error: function(error) {
                console.error("Error fetching Google Sheet CSV:", error);
                tbody.innerHTML = '<tr><td colspan="8" class="text-center py-5 text-danger"><i class="fa-solid fa-circle-exclamation me-2"></i> เกิดข้อผิดพลาดในการโหลดข้อมูล: ' + error.message + '</td></tr>';
            }
        });
    }

    function populateMooFilter(data) {
        const mooFilter = document.getElementById('mooFilter');
        const currentVal = mooFilter.value;
        
        const moos = new Set();
        data.forEach(row => {
            const keys = Object.keys(row);
            const getVal = (possibleKeys) => {
                for(let k of possibleKeys) {
                    const match = keys.find(key => key.trim() === k || key.includes(k));
                    if(match && row[match]) return row[match].trim();
                }
                return '';
            };
            const moo = getVal(['หมู่']);
            if (moo && moo !== '-') {
                const mooMatch = moo.match(/\d+/);
                if (mooMatch) {
                    moos.add(mooMatch[0]);
                }
            }
        });

        const sortedMoos = Array.from(moos).sort((a, b) => parseInt(a) - parseInt(b));
        
        let html = '<option value="">ทุกหมู่บ้าน</option>';
        sortedMoos.forEach(m => {
            html += `<option value="${m}">หมู่ ${m}</option>`;
        });
        
        mooFilter.innerHTML = html;
        if (sortedMoos.includes(currentVal)) {
            mooFilter.value = currentVal;
        }
    }

    function renderTable(data) {
        const tbody = document.getElementById('houseTableBody');
        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4 text-muted">ไม่พบข้อมูลที่ตรงกับเงื่อนไขการค้นหา</td></tr>';
            return;
        }

        let html = '';
        data.forEach(row => {
            // Check keys as Google Sheet might add quotes or slight variations
            const keys = Object.keys(row);
            const getVal = (possibleKeys) => {
                for(let k of possibleKeys) {
                    const match = keys.find(key => key.trim() === k || key.includes(k));
                    if(match && row[match]) return row[match].trim();
                }
                return '-';
            };

            const houseCode = getVal(['รหัสบ้าน', 'รหัส']);
            const houseNo = getVal(['บ้านเลขที่']);
            const moo = getVal(['หมู่']);
            const name = getVal(['ชื่อ-สกุล(เจ้าบ้าน)', 'ชื่อ-สกุล']);
            const coords = getVal(['พิกัด']);
            const imgBuilding = getVal(['ภาพถ่ายสิ่งปลูกสร้าง']);
            const imgTrash = getVal(['ภาพถ่ายถังขยะ']);
            const imgWater = getVal(['ภาพถ่ายมิเตอร์น้ำประปา', 'ภาพถ่ายมิเตอร์น้ำ']);

            // Formatting Maps links
            let coordsHtml = '-';
            if (coords !== '-' && coords !== '') {
                const [lat, lng] = coords.split(',').map(s => s.trim());
                if (lat && lng) {
                    coordsHtml = `<a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank" class="text-indigo-600 hover:text-indigo-800 text-decoration-none">
                        <i class="fa-solid fa-location-dot me-1 text-danger"></i> ${lat.substring(0,8)}, ${lng.substring(0,8)}
                    </a>`;
                } else {
                    coordsHtml = coords;
                }
            }

            // Formatting Image Check
            const renderImgIcon = (val) => {
                if (val && val !== '-' && val.length > 5) {
                    return `<span class="badge bg-success/20 text-success border border-success/30 px-2 py-1"><i class="fa-solid fa-check me-1"></i>มีภาพ</span>`;
                }
                return `<span class="badge bg-slate-100 text-slate-400 border border-slate-200 px-2 py-1">-</span>`;
            };

            html += `
                <tr>
                    <td class="ps-4 fw-bold text-slate-700">${houseCode}</td>
                    <td>${houseNo}</td>
                    <td class="text-center">หมู่ ${moo}</td>
                    <td>${name}</td>
                    <td>${coordsHtml}</td>
                    <td class="text-center">${renderImgIcon(imgBuilding)}</td>
                    <td class="text-center">${renderImgIcon(imgTrash)}</td>
                    <td class="text-center">${renderImgIcon(imgWater)}</td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
    }

    function filterTable() {
        const searchTxt = document.getElementById('searchInput').value.toLowerCase();
        const mooFilter = document.getElementById('mooFilter').value;
        
        const filtered = allData.filter(row => {
            const keys = Object.keys(row);
            const getVal = (possibleKeys) => {
                for(let k of possibleKeys) {
                    const match = keys.find(key => key.trim() === k || key.includes(k));
                    if(match && row[match]) return row[match].trim().toLowerCase();
                }
                return '';
            };

            const houseNo = getVal(['บ้านเลขที่']);
            const name = getVal(['ชื่อ-สกุล(เจ้าบ้าน)', 'ชื่อ-สกุล']);
            const moo = getVal(['หมู่']);

            let matchSearch = true;
            if (searchTxt) {
                matchSearch = houseNo.includes(searchTxt) || name.includes(searchTxt);
            }

            let matchMoo = true;
            if (mooFilter) {
                matchMoo = moo === mooFilter;
            }

            return matchSearch && matchMoo;
        });

        renderTable(filtered);
    }
</script>
</body>
</html>
