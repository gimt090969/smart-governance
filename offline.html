<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ไม่มีการเชื่อมต่ออินเทอร์เน็ต - Smart Governance">
    <title>ไม่มีการเชื่อมต่ออินเทอร์เน็ต - Smart Governance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            background: linear-gradient(145deg, #0f1f3d 0%, #1a3a6b 50%, #1240ab 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            font-family: 'Sarabun', 'Prompt', sans-serif;
            color: #fff;
        }

        .offline-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 3rem;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .icon-circle {
            width: 100px;
            height: 100px;
            background: rgba(239, 68, 68, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            color: #ef4444;
            font-size: 3rem;
        }

        .retry-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            margin-top: 1.5rem;
        }

        .retry-btn:hover {
            background: white;
            color: #1e3a8a;
        }
    </style>
</head>

<body>
    <!-- Background Elements -->
    <div class="position-absolute top-0 start-0 w-100 h-100 overflow-hidden" style="z-index: 0;">
        <div class="position-absolute rounded-circle"
            style="width: 600px; height: 600px; background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, transparent 70%); top: -200px; right: -200px;">
        </div>
        <div class="position-absolute rounded-circle"
            style="width: 800px; height: 800px; background: radial-gradient(circle, rgba(16,185,129,0.1) 0%, transparent 70%); bottom: -400px; left: -200px;">
        </div>
    </div>

    <div class="offline-card position-relative" style="z-index: 1;">
        <div class="icon-circle">
            <i class="fa-solid fa-wifi-slash"></i>
        </div>
        <h2 class="fw-bold mb-3">ไม่มีการเชื่อมต่ออินเทอร์เน็ต</h2>
        <p class="text-white-50 mb-4">ไม่สามารถเชื่อมต่ออินเทอร์เน็ตได้ในขณะนี้<br>กรุณาตรวจสอบการเชื่อมต่อของคุณและลองใหม่อีกครั้ง</p>
        <button onclick="window.location.reload()" class="retry-btn">
            <i class="fa-solid fa-rotate-right me-2"></i>ลองใหม่
        </button>
    </div>
</body>
</html>
